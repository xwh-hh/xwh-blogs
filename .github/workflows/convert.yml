name: Convert TTF to WOFF2

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install woff2 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y woff2

      - name: Verify TTF file exists
        run: |
          ls -la docs/fonts/LXGWWenKai-Regular.ttf
          # 如果文件不存在，这里会报错，并停止执行

      - name: Convert TTF to WOFF2
        run: |
          cd docs/fonts
          woff2_compress LXGWWenKai-Regular.ttf
          # 如果命令失败，这里会报错

      - name: Upload WOFF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: LXGWWenKai-Regular.woff2
          path: docs/fonts/LXGWWenKai-Regular.woff2